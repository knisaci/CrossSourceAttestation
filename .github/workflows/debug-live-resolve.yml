name: Debug failed live Bradbury resolve
on:
  push:
    branches: ["fix/live-resolve-disagree-20261021"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: 
          node-version: "22"
      - run: npm install --prefix frontend --no-audit --no-fund
      - run: node frontend/scripts/debug-resolve-failure.mjs
