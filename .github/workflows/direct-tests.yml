name: Direct Mode regression suite
on:
  pull_request:
  push:
    branches: [main, "fix/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  direct-mode:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'genlayer-test @ git+https://github.com/genlayerlabs/genlayer-testing-suite.git@343e3a358f9e235a93b49c60721ce7676585ff07' pytest
      - run: python -m pytest tests/direct/ -v
