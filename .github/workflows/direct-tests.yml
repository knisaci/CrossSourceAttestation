name: CrossSource regression verification
on:
  pull_request:
  push:
    branches: [main, "fix/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract-path:
    name: Real contract methods (SDK isolated)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest tests/unit/ -v
      - run: python -m py_compile contracts/CrossSourceAttestation.py
  direct-mode:
    name: Native GenLayer Direct Mode (SDK compatibility)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'genlayer-test @ git+https://github.com/genlayerlabs/genlayer-testing-suite.git@343e3a358f9e235a93b49c60721ce7676585ff07' pytest
      - run: python -m pytest tests/direct/ -x -s -v
        env:
          GENVM_VERSION: v0.2.16
